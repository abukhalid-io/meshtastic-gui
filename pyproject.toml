[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meshtastic-gui"
version = "0.1.0"
description = "Desktop GUI (Windows & Linux) for setting up and using Meshtastic devices"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.6",
    "meshtastic>=2.5",
    "pyserial>=3.5",
    "pyqtlet2[PySide6]>=0.9",
    "paho-mqtt>=2.1",
]

[project.scripts]
meshtastic-gui-shortcut = "meshtastic_gui.shortcut:main"

[project.gui-scripts]
meshtastic-gui = "meshtastic_gui.app:main"

[tool.setuptools.packages.find]
include = ["meshtastic_gui*"]
